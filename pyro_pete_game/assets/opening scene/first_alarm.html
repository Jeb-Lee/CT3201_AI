<title>First Alarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:       #150f0c;
    --ink-soft:  #241a17;
    --paper:     #e7ddc9;
    --paper-dim: #b6ab95;
    --ember:     #ff6a2c;
    --ember-hot: #ffb84d;
    --brick:     #7a4335;
    --smoke:     #9b958f;
  }

  *{ box-sizing:border-box; }

  body{
    background: var(--ink);
    color: var(--paper);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-inline:16px;
    padding-block:40px;
    font-family:"Special Elite", "Courier New", monospace;
  }

  .stage{
    width:100%;
    max-width:920px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  .slate{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    width:100%;
    gap:12px;
    flex-wrap:wrap;
  }

  .slate h1{
    font-family:"Rye", "Georgia", serif;
    font-weight:400;
    font-size:clamp(22px, 4vw, 34px);
    letter-spacing:0.04em;
    color:var(--paper);
    margin:0;
    text-wrap:balance;
    text-shadow: 0 0 18px rgba(255,106,44,0.25);
  }

  .slate .take{
    font-size:12px;
    letter-spacing:0.12em;
    color:var(--paper-dim);
    text-transform:uppercase;
    white-space:nowrap;
  }

  .screen-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:6px;
    background:#000;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.6),
      0 0 0 8px var(--ink-soft),
      0 0 46px 6px rgba(255,106,44,0.22),
      0 26px 60px -20px rgba(0,0,0,0.85);
    overflow:hidden;
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }

  .vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }

  .scanlines{
    position:absolute; inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.16) 0px,
      rgba(0,0,0,0.16) 1px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0) 3px
    );
    mix-blend-mode:multiply;
    opacity:0.5;
  }

  .prompt{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%) scale(0.9);
    font-family:"Press Start 2P", monospace;
    font-size: clamp(9px, 2.1vw, 15px);
    color: var(--ember-hot);
    text-shadow: 0 0 6px rgba(255,184,77,0.9), 0 0 18px rgba(255,106,44,0.6);
    letter-spacing:0.06em;
    opacity:0;
    white-space:nowrap;
    pointer-events:none;
  }

  .prompt.show{
    animation: prompt-in 0.5s ease-out forwards, prompt-blink 1.1s ease-in-out 0.6s infinite;
  }

  @keyframes prompt-in{
    from{ opacity:0; transform:translate(-50%,-50%) scale(0.9); }
    to{   opacity:1; transform:translate(-50%,-50%) scale(1); }
  }
  @keyframes prompt-blink{
    0%, 55%{ opacity:1; }
    75%{ opacity:0.15; }
    100%{ opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .prompt.show{ animation:none; opacity:1; transform:translate(-50%,-50%) scale(1); }
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    gap:14px;
    flex-wrap:wrap;
  }

  .note{
    font-size:13px;
    color:var(--paper-dim);
    max-width:52ch;
    line-height:1.5;
    margin:0;
  }

  button.replay{
    font-family:"Special Elite", monospace;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--paper);
    background:var(--ink-soft);
    border:1px solid rgba(255,106,44,0.55);
    border-radius:3px;
    padding:10px 18px;
    cursor:pointer;
    white-space:nowrap;
    transition:background-color 0.15s ease, box-shadow 0.15s ease;
  }
  button.replay:hover{ background:#2f221d; box-shadow:0 0 14px rgba(255,106,44,0.35); }
  button.replay:focus-visible{
    outline:2px solid var(--ember-hot);
    outline-offset:2px;
  }
</style>

<div class="stage">
  <div class="slate">
    <h1>Pyro Pete &mdash; Opening Sequence</h1>
    <span class="take">First Alarm &middot; Take 01</span>
  </div>

  <div class="screen-wrap">
    <canvas id="scene" width="480" height="270" aria-label="Animated title sequence: the camera drops from a burning rooftop to street level, where Pete the firefighter and a rival AI robot walk in and turn toward the building."></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="prompt" id="prompt">PRESS ENTER TO START</div>
  </div>

  <div class="controls">
    <p class="note">Dispatch is already rolling by the time the camera catches up. Press <strong>Enter</strong> or hit replay to run the sequence again.</p>
    <button class="replay" id="replayBtn" type="button">&#8635; Replay</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  var promptEl = document.getElementById("prompt");
  var replayBtn = document.getElementById("replayBtn");

  var W = canvas.width, H = canvas.height;          // logical draw resolution
  var WORLD_W = 480, WORLD_H = 1400;                 // world space
  var GROUND_Y = 1185;                                // sidewalk baseline (feet), inside the sidewalk band
  var GROUND_VIEW_Y = 1069;                           // camera focus at street level — keeps the building's
                                                       // base low in frame instead of centered

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------------------------------------------------------------- assets
  var SPRITE_NAMES = [
    "pete_walk_right_1","pete_walk_right_2","pete_walk_right_3","pete_walk_right_4",
    "pete_walk_up_1","pete_walk_up_2","pete_walk_up_3","pete_walk_up_4","pete_idle_up",
    "robot_walk_left_1","robot_walk_left_2","robot_walk_left_3","robot_walk_left_4",
    "robot_walk_up_1","robot_walk_up_2","robot_walk_up_3","robot_walk_up_4","robot_idle_up"
  ];
  var sprites = {};
  var loaded = 0;

  function loadSprites(cb){
    SPRITE_NAMES.forEach(function(name){
      var img = new Image();
      img.onload = img.onerror = function(){
        loaded++;
        if (loaded === SPRITE_NAMES.length) cb();
      };
      img.src = "sprites/" + name + ".png";
      sprites[name] = img;
    });
  }

  // -------------------------------------------------------------- building
  // Prerendered once onto an offscreen canvas, then stamped through the
  // camera transform every frame instead of redrawing every brick.
  var bW = WORLD_W, bH = WORLD_H;
  var bLayer = document.createElement("canvas");
  bLayer.width = bW; bLayer.height = bH;
  var bctx = bLayer.getContext("2d");

  var BLD_X0 = 90, BLD_X1 = 390;      // main facade bounds
  var BLD_TOP = 130, BLD_GROUND = 1150;
  var FLOOR_H = 58, FLOORS = 16;
  var FIRE_FLOORS = [2, 3];           // rows (0 = top floor) that are ablaze
  var COLS = 6, WIN_W = 34, WIN_H = 34;

  function seededRand(seed){
    var s = seed % 2147483647; if (s <= 0) s += 2147483646;
    return function(){ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  }

  function windowCenters(){
    var xs = [];
    var span = BLD_X1 - BLD_X0;
    var gap = span / COLS;
    for (var c = 0; c < COLS; c++) xs.push(BLD_X0 + gap * (c + 0.5));
    return xs;
  }
  var WIN_XS = windowCenters();

  function drawBuildingLayer(){
    var rnd = seededRand(1900);

    // distant skyline, behind the hero building
    bctx.fillStyle = "#1c1414";
    var skyline = [
      [0,70,1000], [80,120,960], [150,150,900], [430,100,940],
      [470,60,1010], [10,45,1040]
    ];
    skyline.forEach(function(b){
      bctx.fillRect(b[0], b[2], b[1], BLD_GROUND + 30 - b[2]);
    });

    // facade base
    bctx.fillStyle = "#3a1f1a";
    bctx.fillRect(BLD_X0, BLD_TOP, BLD_X1 - BLD_X0, BLD_GROUND - BLD_TOP);

    // brick coursing
    var brickW = 22, brickH = 9;
    for (var y = BLD_TOP; y < BLD_GROUND; y += brickH) {
      var rowIdx = Math.floor((y - BLD_TOP) / brickH);
      var offset = (rowIdx % 2) * (brickW / 2);
      for (var x = BLD_X0 - brickW; x < BLD_X1 + brickW; x += brickW) {
        var bx = x + offset;
        var shade = 0.85 + rnd() * 0.3;
        var r = Math.min(255, 122 * shade), g = Math.min(255, 67 * shade), bl = Math.min(255, 53 * shade);
        bctx.fillStyle = "rgb(" + (r|0) + "," + (g|0) + "," + (bl|0) + ")";
        bctx.fillRect(Math.max(BLD_X0, bx), y, Math.min(brickW - 1, BLD_X1 - Math.max(BLD_X0,bx)), brickH - 1);
      }
    }
    // clip re-fill outside facade bounds to remove overhang (simple re-mask)
    bctx.fillStyle = "#1c1414";
    bctx.fillRect(0, BLD_TOP, BLD_X0, BLD_GROUND - BLD_TOP);
    bctx.fillRect(BLD_X1, BLD_TOP, bW - BLD_X1, BLD_GROUND - BLD_TOP);
    // repaint skyline over that mask region (already drawn once, keep as-is)

    // windows
    for (var f = 0; f < FLOORS; f++) {
      var wy = BLD_TOP + 26 + f * FLOOR_H;
      var isFire = FIRE_FLOORS.indexOf(f) !== -1;
      for (var c2 = 0; c2 < COLS; c2++) {
        var wx = WIN_XS[c2] - WIN_W / 2;
        // stone trim
        bctx.fillStyle = "#2b1e19";
        bctx.fillRect(wx - 4, wy - 4, WIN_W + 8, WIN_H + 10);
        // arched cap
        bctx.beginPath();
        bctx.arc(wx + WIN_W / 2, wy - 4, WIN_W / 2 + 3, Math.PI, 2 * Math.PI);
        bctx.fill();
        // glass / interior
        bctx.fillStyle = isFire ? "#5c2210" : "#120c0a";
        bctx.fillRect(wx, wy, WIN_W, WIN_H);
        bctx.beginPath();
        bctx.arc(wx + WIN_W / 2, wy, WIN_W / 2, Math.PI, 2 * Math.PI);
        bctx.fill();
        if (isFire) {
          bctx.fillStyle = "rgba(255,140,50,0.55)";
          bctx.fillRect(wx, wy + WIN_H * 0.35, WIN_W, WIN_H * 0.65);
        } else {
          bctx.fillStyle = "rgba(231,221,201,0.10)";
          bctx.fillRect(wx + 3, wy + 3, WIN_W - 6, 6);
        }
        // mullion
        bctx.fillStyle = "#2b1e19";
        bctx.fillRect(wx + WIN_W / 2 - 1, wy - 4, 2, WIN_H + 4);
      }
      // cornice every 4 floors
      if (f % 4 === 0) {
        bctx.fillStyle = "#2b1e19";
        bctx.fillRect(BLD_X0 - 6, wy + FLOOR_H - 20, (BLD_X1 - BLD_X0) + 12, 6);
      }
    }

    // roof parapet + water tower + chimney
    bctx.fillStyle = "#2b1e19";
    bctx.fillRect(BLD_X0 - 8, BLD_TOP - 10, (BLD_X1 - BLD_X0) + 16, 14);
    // water tower
    var wtX = BLD_X0 + 70, wtY = BLD_TOP - 62;
    bctx.fillStyle = "#3a2a20";
    bctx.fillRect(wtX - 4, wtY + 30, 6, 32);
    bctx.fillRect(wtX + 34, wtY + 30, 6, 32);
    bctx.fillStyle = "#4a3527";
    bctx.beginPath();
    bctx.moveTo(wtX - 6, wtY + 30);
    bctx.lineTo(wtX + 40, wtY + 30);
    bctx.lineTo(wtX + 34, wtY);
    bctx.lineTo(wtX, wtY);
    bctx.closePath();
    bctx.fill();
    bctx.fillStyle = "#5a4230";
    bctx.beginPath();
    bctx.moveTo(wtX - 2, wtY);
    bctx.lineTo(wtX + 36, wtY);
    bctx.lineTo(wtX + 17, wtY - 16);
    bctx.closePath();
    bctx.fill();
    // chimney (smoke emitter sits at its mouth)
    var chimX = BLD_X1 - 60, chimY = BLD_TOP - 34;
    bctx.fillStyle = "#241a17";
    bctx.fillRect(chimX, chimY, 22, 44);
    bctx.fillStyle = "#3a2a20";
    bctx.fillRect(chimX - 3, chimY - 6, 28, 8);

    // ground floor entrance
    var doorW = 96, doorX = (BLD_X0 + BLD_X1) / 2 - doorW / 2, doorY = BLD_GROUND - 96;
    bctx.fillStyle = "#1a1210";
    bctx.fillRect(doorX, doorY, doorW, 96);
    bctx.beginPath();
    bctx.arc(doorX + doorW / 2, doorY, doorW / 2, Math.PI, 2 * Math.PI);
    bctx.fill();
    bctx.strokeStyle = "#4a3527";
    bctx.lineWidth = 5;
    bctx.beginPath();
    bctx.moveTo(doorX - 4, BLD_GROUND);
    bctx.lineTo(doorX - 4, doorY);
    bctx.arc(doorX + doorW / 2, doorY, doorW / 2 + 4, Math.PI, 2 * Math.PI);
    bctx.lineTo(doorX + doorW + 4, BLD_GROUND);
    bctx.stroke();
    // door leaves
    bctx.fillStyle = "#2b1e19";
    bctx.fillRect(doorX + doorW/2 - 2, doorY, 4, 96);

    // steps (sunlit stone)
    bctx.fillStyle = "#8f7c68";
    for (var s = 0; s < 3; s++) {
      bctx.fillRect(doorX - 14 - s*4, BLD_GROUND + s*6, doorW + 28 + s*8, 6);
    }

    // sidewalk band across full world width (daylight concrete)
    bctx.fillStyle = "#a19a8d";
    bctx.fillRect(0, BLD_GROUND + 18, bW, 60);
    bctx.strokeStyle = "rgba(60,52,42,0.4)";
    bctx.lineWidth = 2;
    for (var lx = 0; lx < bW; lx += 40) {
      bctx.beginPath(); bctx.moveTo(lx, BLD_GROUND + 18); bctx.lineTo(lx, BLD_GROUND + 78); bctx.stroke();
    }

    // lamp posts flanking the entrance (glass, unlit in daylight)
    [BLD_X0 - 40, BLD_X1 + 40].forEach(function(lx2){
      bctx.fillStyle = "#1c1414";
      bctx.fillRect(lx2 - 2, BLD_GROUND - 70, 4, 88);
      bctx.beginPath();
      bctx.arc(lx2, BLD_GROUND - 78, 8, 0, Math.PI * 2);
      bctx.fillStyle = "#c9c3b8";
      bctx.fill();
    });
  }
  drawBuildingLayer();

  var FIRE_WINDOW_WORLD = [];
  FIRE_FLOORS.forEach(function(f){
    var wy = BLD_TOP + 26 + f * FLOOR_H + WIN_H * 0.6;
    WIN_XS.forEach(function(wx){ FIRE_WINDOW_WORLD.push({x: wx, y: wy}); });
  });
  var CHIMNEY_TOP = { x: BLD_X1 - 49, y: BLD_TOP - 40 };

  // ---------------------------------------------------------------- particles
  var embers = [], smoke = [];

  function spawnEmbers(dt){
    FIRE_WINDOW_WORLD.forEach(function(p){
      if (Math.random() < dt * 2.2) {
        embers.push({
          x: p.x + (Math.random() - 0.5) * 20,
          y: p.y,
          vx: (Math.random() - 0.5) * 10,
          vy: -18 - Math.random() * 22,
          life: 0, maxLife: 1.1 + Math.random() * 0.9,
          size: 1.4 + Math.random() * 1.6
        });
      }
    });
  }
  function spawnSmoke(dt){
    if (Math.random() < dt * 3) {
      smoke.push({
        x: CHIMNEY_TOP.x + (Math.random() - 0.5) * 8,
        y: CHIMNEY_TOP.y,
        vx: (Math.random() - 0.5) * 4,
        vy: -14 - Math.random() * 8,
        r: 6 + Math.random() * 4,
        life: 0, maxLife: 5 + Math.random() * 2.5
      });
    }
    FIRE_WINDOW_WORLD.forEach(function(p){
      if (Math.random() < dt * 0.9) {
        smoke.push({
          x: p.x + (Math.random() - 0.5) * 14, y: p.y - 6,
          vx: (Math.random() - 0.5) * 6, vy: -10 - Math.random() * 6,
          r: 5 + Math.random() * 3, life: 0, maxLife: 3.5 + Math.random() * 1.5
        });
      }
    });
  }
  function stepParticles(dt){
    for (var i = embers.length - 1; i >= 0; i--) {
      var e = embers[i];
      e.life += dt;
      if (e.life >= e.maxLife) { embers.splice(i, 1); continue; }
      e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 6 * dt;
    }
    for (var j = smoke.length - 1; j >= 0; j--) {
      var s = smoke[j];
      s.life += dt;
      if (s.life >= s.maxLife) { smoke.splice(j, 1); continue; }
      s.x += s.vx * dt; s.y += s.vy * dt; s.r += dt * 3.2;
    }
  }
  function drawParticles(){
    smoke.forEach(function(s){
      var t = s.life / s.maxLife;
      var alpha = (1 - t) * 0.35;
      var grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
      grad.addColorStop(0, "rgba(155,149,143," + alpha + ")");
      grad.addColorStop(1, "rgba(155,149,143,0)");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    });
    embers.forEach(function(e){
      var t = e.life / e.maxLife;
      var alpha = 1 - t;
      ctx.fillStyle = "rgba(255,180,80," + alpha + ")";
      ctx.fillRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);
      ctx.fillStyle = "rgba(255,106,44," + (alpha*0.5) + ")";
      ctx.fillRect(e.x - e.size, e.y - e.size, e.size*2, e.size*2);
    });
  }

  // ----------------------------------------------------------------- timeline
  var T1 = 2.2, T2 = 7.0, T3 = 7.4, T4 = 9.6, T5 = 10.6, T6 = 11.2;
  var FINAL_T = T6 + 1;

  function easeInOutCubic(x){
    return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3) / 2;
  }
  function lerp(a,b,t){ return a + (b-a) * t; }
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }

  function cameraAt(t){
    if (t < T1) {
      return { focusY: 100 + Math.sin(t*0.8)*3, zoom: 1.9, tilt: 1 };
    } else if (t < T2) {
      var p = easeInOutCubic(clamp01((t - T1) / (T2 - T1)));
      return { focusY: lerp(100, GROUND_VIEW_Y, p), zoom: lerp(1.9, 1.0, p), tilt: lerp(1, 0, p) };
    } else {
      return { focusY: GROUND_VIEW_Y, zoom: 1.0, tilt: 0 };
    }
  }

  function frameIndexFor(t, fps){
    return Math.floor(t * fps) % 4;
  }

  var ENTER_Y = BLD_GROUND - 12;   // just inside the doorway threshold

  function charactersAt(t){
    var pete = { x: -40, y: GROUND_Y, scale: 1, sprite: null };
    var bot  = { x: WORLD_W+60, y: GROUND_Y, scale: 1, sprite: null };

    if (t < T3) {
      pete.sprite = sprites.pete_walk_right_1; bot.sprite = sprites.robot_walk_left_1;
      pete.x = -60; bot.x = WORLD_W + 60;
    } else if (t < T4) {
      var p = clamp01((t - T3) / (T4 - T3));
      pete.x = lerp(-40, 214, p);
      bot.x  = lerp(WORLD_W+40, 266, p);
      var fi = frameIndexFor(t, 8) + 1;
      pete.sprite = sprites["pete_walk_right_" + fi];
      bot.sprite  = sprites["robot_walk_left_" + fi];
    } else if (t < T5) {
      // turn to face the building and walk toward the doorway, shrinking
      // a little to read as moving away from the camera
      var p2 = easeInOutCubic(clamp01((t - T4) / (T5 - T4)));
      pete.x = lerp(214, 202, p2); bot.x = lerp(266, 278, p2);
      pete.y = lerp(GROUND_Y, ENTER_Y, p2);
      bot.y  = lerp(GROUND_Y, ENTER_Y, p2);
      pete.scale = lerp(1, 0.55, p2);
      bot.scale  = lerp(1, 0.55, p2);
      var fi2 = frameIndexFor(t, 6) + 1;
      pete.sprite = sprites["pete_walk_up_" + fi2];
      bot.sprite  = sprites["robot_walk_up_" + fi2];
    } else {
      pete.x = 202; bot.x = 278; pete.y = ENTER_Y; bot.y = ENTER_Y;
      pete.scale = 0.55; bot.scale = 0.55;
      pete.sprite = sprites.pete_idle_up; bot.sprite = sprites.robot_idle_up;
    }
    return { pete: pete, bot: bot };
  }

  function drawCharacter(c, baseH, active){
    if (!active || !c.sprite || !c.sprite.width) return;
    var ratio = c.sprite.width / c.sprite.height;
    var h = baseH * c.scale, w = h * ratio;
    ctx.drawImage(c.sprite, c.x - w/2, c.y - h, w, h);
  }

  // -------------------------------------------------------------------- sky
  function drawSky(progress){
    // progress: 0 near rooftop (clear blue, up high), 1 at ground
    // (hazier, sun-bleached by the smoke hanging over the street)
    var topA = [107, 179, 226], topB = [151, 199, 224];
    var botA = [186, 219, 232], botB = [231, 205, 165];
    var top = [ lerp(topA[0],topB[0],progress), lerp(topA[1],topB[1],progress), lerp(topA[2],topB[2],progress) ];
    var bot = [ lerp(botA[0],botB[0],progress), lerp(botA[1],botB[1],progress), lerp(botA[2],botB[2],progress) ];
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, "rgb(" + top.map(function(v){return v|0;}).join(",") + ")");
    g.addColorStop(1, "rgb(" + bot.map(function(v){return v|0;}).join(",") + ")");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // sun, high and to one side
    var sunGrad = ctx.createRadialGradient(W*0.78, H*0.16, 2, W*0.78, H*0.16, 46);
    sunGrad.addColorStop(0, "rgba(255,250,230,0.9)");
    sunGrad.addColorStop(1, "rgba(255,250,230,0)");
    ctx.fillStyle = sunGrad;
    ctx.fillRect(0,0,W,H);

    // ember-tinted haze bleeding up behind the fire floors
    var glow = ctx.createRadialGradient(W*0.62, H*0.55, 10, W*0.62, H*0.55, H*0.9);
    glow.addColorStop(0, "rgba(255,106,44," + (0.09 + 0.09*(1-Math.abs(progress-0.5)*2)) + ")");
    glow.addColorStop(1, "rgba(255,106,44,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0,0,W,H);
  }

  // ----------------------------------------------------------------- render
  var startTime = null;
  var promptShown = false;

  function render(t){
    var cam = cameraAt(t);
    var groundProgress = clamp01((cam.focusY - 100) / (GROUND_VIEW_Y - 100));

    drawSky(groundProgress);

    ctx.save();
    ctx.translate(W/2, H/2);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.transform(1, 0, cam.tilt * 0.10, 1, 0, 0);
    ctx.translate(-WORLD_W/2, -cam.focusY);

    ctx.drawImage(bLayer, 0, 0);
    drawParticles();

    var chars = charactersAt(t);
    var drawH = 76;
    var active = t >= T3;
    if (chars.pete.x < chars.bot.x) {
      drawCharacter(chars.pete, drawH, active);
      drawCharacter(chars.bot, drawH, active);
    } else {
      drawCharacter(chars.bot, drawH, active);
      drawCharacter(chars.pete, drawH, active);
    }

    ctx.restore();

    if (t >= T6 && !promptShown) {
      promptShown = true;
      promptEl.classList.add("show");
    }
  }

  var lastTs = null;
  function loop(ts){
    if (startTime === null) startTime = ts;
    var t = (ts - startTime) / 1000;
    var dt = lastTs === null ? 0 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;

    if (t < T2 + 3) { spawnEmbers(dt); spawnSmoke(dt); }
    stepParticles(dt);
    render(t);

    requestAnimationFrame(loop);
  }

  function renderStatic(){
    render(FINAL_T);
    promptEl.classList.add("show");
  }

  function replay(){
    startTime = null; lastTs = null; promptShown = false;
    embers = []; smoke = [];
    promptEl.classList.remove("show");
    // force reflow so the blink animation restarts cleanly
    void promptEl.offsetWidth;
    if (reduceMotion) { renderStatic(); }
  }

  replayBtn.addEventListener("click", replay);
  window.addEventListener("keydown", function(ev){
    if (ev.key === "Enter") replay();
  });

  loadSprites(function(){
    if (reduceMotion) {
      renderStatic();
    } else {
      requestAnimationFrame(loop);
    }
  });
})();
</script>
